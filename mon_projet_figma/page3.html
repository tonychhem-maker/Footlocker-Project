<!DOCTYPE html>

<body>
    <!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <title>Formulaire</title>
</head>
<body>
    
     <div class="container">
    <div class="logo">
        <img src="../image/logo.jpeg" alt="Logo">
        <h1>RECLAMER MON PRIX</h1>
    </div>

    <form action="#" method="post">
        <div class="form-group">
            <label for="name">NOM:</label>
            <input type="text" id="name" name="name" placeholder="Entrer votre nom" required>
        </div>

        <div class="form-group">
            <label for="prenom">PRENOM:</label>
            <input type="text" id="prenom" name="prenom" placeholder="Entrer votre prénom" required>
        </div>

        <div class="form-group">
            <label for="email">EMAIL:</label>
            <input type="email" id="email" name="email" placeholder="Entrer votre adresse mail" required>
        </div>

        <div class="form-group">
            <label for="telephone">TELEPHONE:</label>
            <input type="tel" id="telephone" name="telephone" placeholder="Entrer votre numéro" required>
        </div>

        <div class="footer-form">
            <img class="sneaker-img" src="../image/snekers.jpeg" alt="Sneakers">
            <button type="submit" class="btn-valider">Valider</button>
        </div>
    </form>
</div>
</body>
</html>

</body>
</html>
