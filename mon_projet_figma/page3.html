<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">

    <title>Le formulaire</title>
</head>
<body>
    <h1>RECLAMER MON PRIX</h1>
    <form action="">
        <label for="name">Nom: </label>
        <input type="text" id="name" name="name" required>

         <label for="prénom">Prenom: </label>
        <input type="text" id="prénom" name="prénom" required>

        <label for="email">EMAIL: </label>
        <input type="email" id="email" name="email" required>

        <label for="téléphone">TELEPHONE: </label>
        <input type="téléphone" id="téléphone" name="téléphone" required>

        <button type="valider">Valider</button>
</body>
